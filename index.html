<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Happy Birthday Amma</title>
  <style>
    body {
      margin: 0;
      background: black;
      overflow: hidden;
      color: white;
      font-family: 'Arial', sans-serif;
      text-align: center;
    }
    h1 {
      font-size: 3em;
      margin-top: 2em;
      display: inline-block;
      position: absolute;
      top: 40%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: white;
      font-weight: bold;
    }
    #message span {
      opacity: 0;
      transition: opacity 0.3s;
    }
    canvas {
      position: fixed;
      top: 0;
      left: 0;
    }
    .from {
      position: absolute;
      top: 20px;
      width: 100%;
      text-align: center;
      font-size: 1.2em;
      color: white;
    }
  </style>
</head>
<body>
  <div class="from">From Jay</div>
  <canvas id="fireworks"></canvas>
  <h1 id="message"></h1>

  <script>
    // Fireworks code
    const canvas = document.getElementById("fireworks");
    const ctx = canvas.getContext("2d");
    let width, height;

    function resizeCanvas() {
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = width;
      canvas.height = height;
    }

    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();

    class Firework {
      constructor() {
        this.reset();
      }
      reset() {
        this.x = Math.random() * width;
        this.y = height;
        this.targetY = Math.random() * height / 2;
        this.speed = 5 + Math.random() * 3;
        this.particles = [];
        this.exploded = false;
        this.color = `hsl(${Math.random() * 360}, 100%, 50%)`;
      }
      update() {
        if (!this.exploded) {
          this.y -= this.speed;
          if (this.y <= this.targetY) {
            this.exploded = true;
            for (let i = 0; i < 30; i++) {
              this.particles.push(new Particle(this.x, this.y, this.color));
            }
          }
        } else {
          this.particles.forEach(p => p.update());
          this.particles = this.particles.filter(p => p.life > 0);
        }
      }
      draw(ctx) {
        if (!this.exploded) {
          ctx.beginPath();
          ctx.arc(this.x, this.y, 2, 0, Math.PI * 2);
          ctx.fillStyle = this.color;
          ctx.fill();
        } else {
          this.particles.forEach(p => p.draw(ctx));
        }
      }
    }

    class Particle {
      constructor(x, y, color) {
        this.x = x;
        this.y = y;
        this.life = 50;
        this.speedX = (Math.random() - 0.5) * 6;
        this.speedY = (Math.random() - 0.5) * 6;
        this.color = color;
      }
      update() {
        this.x += this.speedX;
        this.y += this.speedY;
        this.life--;
      }
      draw(ctx) {
        ctx.globalAlpha = this.life / 50;
        ctx.beginPath();
        ctx.arc(this.x, this.y, 2, 0, Math.PI * 2);
        ctx.fillStyle = this.color;
        ctx.fill();
        ctx.globalAlpha = 1;
      }
    }

    const fireworks = Array.from({ length: 5 }, () => new Firework());

    function animate() {
      ctx.fillStyle = "rgba(0, 0, 0, 0.2)";
      ctx.fillRect(0, 0, width, height);

      fireworks.forEach(f => {
        f.update();
        f.draw(ctx);
        if (f.exploded && f.particles.length === 0) {
          f.reset();
        }
      });

      requestAnimationFrame(animate);
    }

    animate();

    // Message letter animation
    const message = "HAPPY BIRTHDAY AMMA";
    const messageElement = document.getElementById("message");

    function showMessage() {
      messageElement.innerHTML = '';
      for (let i = 0; i < message.length; i++) {
        const span = document.createElement('span');
        span.textContent = message[i];
        messageElement.appendChild(span);
      }

      let index = 0;
      const spans = messageElement.querySelectorAll('span');
      const interval = setInterval(() => {
        if (index < spans.length) {
          spans[index].style.opacity = 1;
          index++;
        } else {
          clearInterval(interval);
        }
      }, 200);
    }

    setTimeout(showMessage, 5000); // show message after 5 seconds
  </script>
</body>
</html>
